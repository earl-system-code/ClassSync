<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassSync — Student Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. TOP BAR (Floating Header) -->
  <header class="topbar">
    
    <!-- Top Left: Your ClassSync Logo Image -->
    <a href="#" class="brand">
      <img src="ClassSync Education Sync Logo.webp" alt="ClassSync Logo" class="brand-logo-img">
    </a>

    <!-- Top Right: Student Name, Avatar & 3-Dots Button -->
    <div class="user-profile">
      <div class="user-info">
        <div class="user-name">Juan Dela Cruz</div>
        <div class="user-id">26 - 000123</div>
      </div>
      
      <img src="https://ui-avatars.com/api/?name=Juan+Dela+Cruz&background=f60000&color=ffffff" alt="Profile" class="user-avatar">
      
      <!-- 3-Dots Dropdown Menu -->
      <div class="menu-box">
        <button class="dots-btn" onclick="toggleDropdown()">⋮</button>
        
        <div class="dropdown-menu" id="dropdownMenu">
          <a href="#">Student Profile</a>
          <a href="#">Account Settings</a>
          <hr>
          <a href="Login-responsive.html" class="logout">Log Out</a>
        </div>
      </div>
    </div>

  </header>

  <!-- 2. SIDE MENU (Spreads on Hover or Click) -->
  <nav class="sidebar" id="sidebar">
    
    <!-- Button to lock/unlock the menu open -->
    <button class="toggle-btn" onclick="toggleSidebar()">☰</button>

    <!-- Menu Links with Clean Red Line Icons -->
    <ul class="nav-list">
      <li>
        <a href="#" class="active">
          <span class="icon">
            <!-- Dashboard Grid Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
          </span>
          <span class="label">Dashboard</span>
        </a>
      </li>

      <li>
        <a href="#">
          <span class="icon">
            <!-- Attendance Document Check Icon (Matches your reference style!) -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <polyline points="9 15 11 17 15 13"></polyline>
            </svg>
          </span>
          <span class="label">Attendance</span>
        </a>
      </li>

      <li>
        <a href="#">
          <span class="icon">
            <!-- Calendar / Class Schedule Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
          </span>
          <span class="label">Class Schedule</span>
        </a>
      </li>

      <li>
        <a href="#">
          <span class="icon">
            <!-- File / Reports Icon (Matches your folded-corner file style) -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="8" y1="13" x2="16" y2="13"></line>
              <line x1="8" y1="17" x2="13" y2="17"></line>
            </svg>
          </span>
          <span class="label">Reports</span>
        </a>
      </li>

      <li>
        <a href="#">
          <span class="icon">
            <!-- Settings Gear Icon -->
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </span>
          <span class="label">Settings</span>
        </a>
      </li>
    </ul>

  </nav>

  <!-- 3. MAIN PAGE CONTENT -->
  <main class="main-content">
    <div class="welcome-card">
      <h1>Hello! Welcome Back!</h1>
      <p>Point your mouse at the side icons to spread the menu, or click <strong>☰</strong> to keep it open.</p>
    </div>
  </main>

  <!-- Simple JavaScript -->
  <script>
    function toggleSidebar() {
      var sidebar = document.getElementById("sidebar");
      sidebar.classList.toggle("pinned");
    }

    function toggleDropdown() {
      var menu = document.getElementById("dropdownMenu");
      menu.classList.toggle("show");
    }
  </script>

</body>
</html>
